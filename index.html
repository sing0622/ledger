<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>記帳本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101419" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232B4C7E'/%3E%3Cpath d='M32 14a18 18 0 1 0 18 18H32z' fill='%23fff'/%3E%3Cpath d='M36 10v18h18A18 18 0 0 0 36 10z' fill='%23F2B84B'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F2F4F7;--card:#FFFFFF;--ink:#1E2A3A;--muted:#6B7785;--line:#E3E7ED;--chip:#E9EDF2;
  --pri:#2B4C7E;--pri-ink:#FFFFFF;--inc:#11806A;--exp:#C2413A;--warn:#B7791F;
  --shadow:0 1px 2px rgba(30,42,58,.06),0 4px 14px rgba(30,42,58,.05);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101419;--card:#1A2029;--ink:#E7EBF0;--muted:#8D98A6;--line:#2A323D;--chip:#252C36;
  --pri:#6E95D6;--pri-ink:#0E1620;--inc:#3DBB98;--exp:#EF6B60;--warn:#E0A84A;
  --shadow:none;color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101419;--card:#1A2029;--ink:#E7EBF0;--muted:#8D98A6;--line:#2A323D;--chip:#252C36;
    --pri:#6E95D6;--pri-ink:#0E1620;--inc:#3DBB98;--exp:#EF6B60;--warn:#E0A84A;
    --shadow:none;color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
[hidden]{display:none!important}

.app{max-width:560px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 20px 6px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:28px;font-weight:700;margin:0;letter-spacing:.02em}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:calc(0px - var(--gap,0px));z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:max(6px,calc(env(safe-area-inset-bottom) - 14px))}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted)}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--pri)}
.fab{position:fixed;z-index:7;right:max(18px,calc(50% - 262px));bottom:calc(66px + max(6px,calc(env(safe-area-inset-bottom) - 14px)) - var(--gap,0px));width:60px;height:60px;border-radius:50%;background:var(--pri);color:var(--pri-ink);box-shadow:0 6px 18px rgba(43,76,126,.35);display:grid;place-items:center}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.fab:active{transform:scale(.94)}

/* month navigator */
.mnav{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 16px 10px}
.icon-btn{width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;color:var(--muted);display:grid;place-items:center}
.icon-btn:active{background:var(--chip)}
.mlabel{position:relative;padding:6px 14px;border-radius:10px;font-weight:600;font-size:17px;min-width:128px;text-align:center}
.mlabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* hero summary */
.hero{margin:0 20px 18px}
.hero-label{font-size:13px;color:var(--muted)}
.hero-net{font-size:44px;font-weight:700;line-height:1.1;margin:2px 0 12px}
.hero-net.neg{color:var(--exp)}
.meter{height:8px;border-radius:4px;background:color-mix(in srgb,var(--inc) 22%,transparent);overflow:hidden}
.meter i{display:block;height:100%;background:var(--exp);border-radius:4px}
.hero-row{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--muted)}
.hero-row b{color:var(--ink);font-weight:600;margin-left:4px;font-size:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.inc{background:var(--inc)}.dot.exp{background:var(--exp)}
.hero-hint{font-size:12px;color:var(--muted);margin-top:4px}

/* notices */
.notice{display:flex;align-items:center;justify-content:space-between;gap:8px;width:calc(100% - 32px);margin:0 16px 12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--ink);font-size:14px;text-align:left}
.notice .chev{color:var(--muted);font-size:20px}

/* transaction list */
.day{margin:0 16px 14px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 6px}
.group{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;position:relative}
.group > .row + .row::before,.group > .rowwrap + .rowwrap::before{content:"";position:absolute;left:62px;right:0;top:0;height:1px;background:var(--line)}
.rowwrap{position:relative}
.row:active{background:var(--chip)}
.ico{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--cbg,var(--chip))}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t{font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px}
.row-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-style:normal;font-size:10.5px;font-weight:600;color:var(--pri);background:color-mix(in srgb,var(--pri) 13%,transparent);padding:1px 6px;border-radius:6px}
.amt{font-weight:600;font-size:16px;white-space:nowrap}
.amt.income{color:var(--inc)}
.chev-r{color:var(--muted);font-size:20px;margin-left:2px}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-ico{font-size:40px;margin-bottom:6px}
.empty p{margin:4px 0}
.empty b{color:var(--ink);font-weight:600}

/* segmented */
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.exp-on button.on{color:var(--exp)}
.seg.inc-on button.on{color:var(--inc)}
.pad{margin:0 16px 12px}

/* report */
.stats{margin:0 16px 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr}
.stat{padding:12px 16px}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:21px;font-weight:700}
.stat .inc{color:var(--inc)}.stat .exp{color:var(--exp)}
.compare{margin:-4px 20px 16px;font-size:13px;color:var(--muted)}
.compare b{font-weight:600}
.panel{margin:0 16px 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.panel h2{font-size:15px;margin:0 0 10px;font-weight:600}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.panel-h h2{margin:0}
.donut-wrap{display:flex;justify-content:center;padding:6px 0 10px}
.donut-wrap svg{width:210px;height:210px}
.donut-wrap path,.donut-wrap circle{cursor:pointer}
.rank{display:flex;align-items:center;gap:10px;width:100%;padding:9px 2px;text-align:left}
.rank+.rank{border-top:1px solid var(--line)}
.rank .ico{width:32px;height:32px;font-size:17px;border-radius:10px}
.rank-main{flex:1;min-width:0}
.rank-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.rank-top .num{font-weight:600}
.bar{display:block;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.pct{width:46px;text-align:right;font-size:13px;color:var(--muted)}
.bars svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.mtable{width:100%;border-collapse:collapse;font-size:13.5px}
.mtable th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;font-size:12px}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.mtable tr[data-act]{cursor:pointer}
.mtable tr[data-act]:active td{background:var(--chip)}
.mtable .neg{color:var(--exp)}
.mtable tfoot td{font-weight:700}

/* buttons */
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--pri);color:var(--pri-ink);font-weight:600;font-size:16px;text-align:center}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
.btn.danger{background:transparent;color:var(--exp)}
.btn + .btn{margin-top:10px}
.btns{margin:4px 16px 16px}

/* settings */
.sgroup{margin:0 16px 18px}
.sgroup-h{font-size:13px;color:var(--muted);padding:0 6px 6px}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;position:relative;min-height:50px}
.srow + .srow::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--line)}
.srow:active{background:var(--chip)}
.srow .lbl{flex:1}
.srow .lbl small{display:block;font-size:12.5px;color:var(--muted)}
.srow.red{color:var(--exp)}
.sfoot{text-align:center;color:var(--muted);font-size:12.5px;padding:4px 24px 24px;line-height:1.6}

/* sheets */
.sheet-wrap{position:fixed;top:0;left:0;right:0;bottom:calc(0px - var(--gap,0px));z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(10,15,22,.42);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100% - env(safe-area-inset-top) - 24px);background:var(--bg);border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
@media (prefers-reduced-motion: reduce){.sheet,.backdrop{transition:none}}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 16px 10px;flex:none}
.sh-head h3{margin:0;font-size:17px;font-weight:600;text-align:center}
.sh-head .l{justify-self:start}.sh-head .r{justify-self:end}
.link{color:var(--pri);font-size:16px;padding:4px 2px}
.link.strong{font-weight:600}
.link.danger{color:var(--exp)}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;flex:1}
.grip{width:36px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}

/* entry sheet */
.amount-box{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 16px 10px;padding:12px 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.amount-cat{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;min-width:0}
.amount{font-size:34px;font-weight:700;color:var(--exp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount.income{color:var(--inc)}
.amount.zero{color:var(--muted)}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 12px;max-height:min(240px,28vh);overflow-y:auto}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:12px;color:var(--muted)}
.cat .ico{width:42px;height:42px;font-size:21px;border-radius:13px;border:2px solid transparent}
.cat.on{color:var(--ink);font-weight:600}
.cat.on .ico{border-color:var(--cc,var(--pri))}
.cat.add .ico{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-size:20px}
.meta{display:flex;gap:8px;padding:10px 16px}
.pill{position:relative;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:10px;padding:0 10px;height:42px;font-size:14px;flex:none;box-shadow:var(--shadow)}
.pill input[type=date]{position:absolute;inset:0;opacity:0;width:100%}
.note{flex:1;min-width:0;height:42px;border:0;border-radius:10px;background:var(--card);padding:0 12px;font-size:16px;box-shadow:var(--shadow)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 12px 10px}
.key{height:52px;border-radius:12px;background:var(--card);font-size:22px;font-weight:500;box-shadow:var(--shadow)}
.key:active{background:var(--chip)}
.key.fn{font-size:17px;color:var(--muted)}
.key.ok{grid-row:span 2;height:auto;background:var(--pri);color:var(--pri-ink);font-size:18px;font-weight:600}
.key.ok.exp{background:var(--exp);color:#fff}
.key.ok.inc{background:var(--inc);color:#fff}

/* forms */
.field{margin-bottom:14px}
.field > label,.flabel{display:block;font-size:13px;color:var(--muted);margin:0 4px 6px}
.input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font-size:16px;-webkit-appearance:none;appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.inline{display:flex;align-items:center;gap:8px}
.inline .input{flex:1}
.hint{font-size:12.5px;color:var(--muted);margin:6px 4px 0;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:14px}
.chip.on{border-color:var(--pri);color:var(--pri);font-weight:600}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:var(--card);border-radius:12px;padding:8px}
.emoji-grid button{height:38px;font-size:21px;border-radius:9px}
.emoji-grid button.on{background:var(--chip);outline:2px solid var(--pri)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:2px 2px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.preview{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:12px;background:var(--card);border-radius:14px}
.preview .ico{width:48px;height:48px;font-size:26px;border-radius:15px}
.preview b{font-size:17px}
.cat-row{display:flex;align-items:center;position:relative}
.cat-row .row{flex:1}
.mini{width:38px;height:38px;border-radius:10px;color:var(--muted);font-size:16px}
.mini:disabled{opacity:.25}
.mini:active{background:var(--chip)}
.pend{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.pend-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pend-top .row-main{flex:1}
.pend-act{display:flex;gap:8px}
.pend-act .input{flex:1;height:42px}
.pend-act button{padding:0 14px;border-radius:10px;font-size:15px;height:42px}
.pend-act .skip{background:var(--chip);color:var(--muted)}
.pend-act .ok{background:var(--pri);color:var(--pri-ink);font-weight:600}
.steps{margin:0;padding:0 0 0 0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 40px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-size:14px;font-weight:600;display:grid;place-items:center}
.callout{background:var(--card);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;margin-bottom:12px}
.callout.ok{border-left:4px solid var(--inc)}
.callout.warn{border-left:4px solid var(--warn)}
.dialog-msg{padding:0 20px 8px;font-size:15px;line-height:1.6;color:var(--muted)}

/* summary strip, budget, calendar */
.topbar .tb-btn{font-size:14px;color:var(--pri);padding:7px 12px;border-radius:16px;background:color-mix(in srgb,var(--pri) 11%,transparent);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(3,1fr);margin:0 16px 12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.strip > div{padding:10px 12px;min-width:0}
.strip > div + div{border-left:1px solid var(--line)}
.strip small{display:block;font-size:12px;color:var(--muted)}
.strip b{font-size:17px;font-weight:700;white-space:nowrap}
.strip .inc{color:var(--inc)}.strip .exp{color:var(--exp)}
.budget{display:block;width:calc(100% - 32px);margin:0 16px 12px;text-align:left;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.b-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.b-main{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.b-main small{font-size:13px;color:var(--muted)}
.b-main b{font-size:32px;font-weight:700;color:var(--inc);line-height:1.15}
.budget.over .b-main b{color:var(--exp)}
.b-bar{position:relative;height:8px;border-radius:4px;background:var(--chip)}
.b-bar i{display:block;height:100%;border-radius:4px;background:var(--bc,var(--inc))}
.b-bar em{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.45;border-radius:1px;transform:translateX(-1px)}
.b-foot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}
.bset{display:flex;justify-content:space-between;align-items:center;gap:8px;width:calc(100% - 32px);margin:0 16px 12px;padding:11px 14px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-size:14px;text-align:left}
.cal{margin:0 16px 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 6px 6px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-h span{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 4px}
.cd{position:relative;height:56px;margin:1px;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:3px;min-width:0}
.cd-n{font-size:15px;font-weight:500;min-width:26px;height:24px;line-height:24px;text-align:center;border-radius:12px}
.cd-a{font-size:10.5px;color:var(--exp);font-weight:600;letter-spacing:-.03em;white-space:nowrap;max-width:100%;overflow:hidden}
.cd-i{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--inc)}
.cd.today .cd-n{background:var(--pri);color:var(--pri-ink);font-weight:700}
.cd.sel{background:var(--chip)}
.cd.over{background:color-mix(in srgb,var(--exp) 14%,transparent)}
.cd.over.sel{box-shadow:inset 0 0 0 2px var(--exp)}
.cd.sel:not(.over){box-shadow:inset 0 0 0 2px var(--pri)}
.cd.future .cd-n{color:var(--muted)}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:6px 8px 2px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lg.over{background:color-mix(in srgb,var(--exp) 28%,transparent)}
.lg.inc{border-radius:50%;width:7px;height:7px;background:var(--inc);vertical-align:1px}
.day-sel{margin:0 16px 14px;scroll-margin-top:90px}
.ds-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 4px 8px}
.ds-h b{font-size:16px}
.ds-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ds-sub .over{color:var(--exp);font-weight:600}
.ds-sub .ok{color:var(--inc);font-weight:600}
.ds-add{flex:none;padding:7px 12px;border-radius:18px;background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri);font-size:14px;font-weight:600}
.day-empty{background:var(--card);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:14px}

/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-16px);z-index:40;background:#1E2A3A;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#9EC1FF;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><h1 id="title">記帳</h1><button class="tb-btn" id="viewToggle" data-act="toggleView" hidden></button></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" data-act="add" aria-label="記一筆"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabbar"><div class="tabbar-in">
  <button class="tab" data-act="tab" data-tab="list"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>明細</button>
  <button class="tab" data-act="tab" data-tab="report"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>報表</button>
  <button class="tab" data-act="tab" data-tab="fixed"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9.5 15.2l1.8 1.8 3.4-3.6"/></svg>固定收支</button>
  <button class="tab" data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</div></nav>
<div id="toast" role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= 工具 ================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const dim=(y,m)=>new Date(y,m,0).getDate();
const WD='日一二三四五六';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const round2=n=>Math.round(n*100)/100;
const fmt=n=>round2(n).toLocaleString('zh-TW',{maximumFractionDigits:2});
const money=n=>(n<0?'−':'')+'$'+fmt(Math.abs(n));
const shiftMonth=(k,n)=>{let [y,m]=k.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${y}-${pad(m)}`};
const monthRange=k=>{const [y,m]=k.split('-').map(Number);return [`${k}-01`,`${k}-${pad(dim(y,m))}`]};
const slash=s=>s.replaceAll('-','/');
const tint=c=>c+'26';

/* ================= 資料 ================= */
const KEY='ledger.v1';
const COLORS=['#E8833A','#D9488B','#C2413A','#E0A526','#2FA58C','#11806A','#3B82C4','#4F6BD8','#7B61C9','#5AA9D6','#8A6D4E','#8A94A3'];
const EMOJIS='🍜 🍱 🍔 ☕ 🧋 🍺 🛒 🛍️ 👕 💄 🚌 🚇 🚕 ⛽ 🅿️ 🚗 🏠 💡 💧 📶 📱 💻 🎮 🎬 🎤 ✈️ 🏨 🎁 💊 🏥 🦷 📚 ✏️ 🐶 👶 💇 🧾 💳 🏦 📈 💼 💰 🎉 💵 🛡️ ❤️ ⚽ 📦'.split(' ');
function defaultCats(){
  const E=[['餐飲','🍜','#E8833A'],['交通','🚌','#3B82C4'],['購物','🛍️','#D9488B'],['居住','🏠','#7B61C9'],['水電網路','💡','#5AA9D6'],['娛樂','🎮','#E0A526'],['醫療','💊','#2FA58C'],['學習','📚','#4F6BD8'],['人情','🎁','#C2413A'],['其他','📦','#8A94A3']];
  const I=[['薪資','💼','#11806A'],['獎金','🎉','#E0A526'],['投資','📈','#3B82C4'],['兼職','💵','#7B61C9'],['其他','📦','#8A94A3']];
  const mk=(type,arr)=>arr.map(([name,icon,color],i)=>({id:uid(),type,name,icon,color,order:i}));
  return [...mk('expense',E),...mk('income',I)];
}
function defaults(){return {version:1,categories:defaultCats(),tx:[],recurring:[],pending:[],settings:{theme:'auto',lastBackup:null,listView:'calendar',weekStart:0,budget:{period:'none',amount:0,excludeFixed:true}},lastCat:{}}}
function normalize(d){
  const b=defaults();d=d||{};
  return {version:1,
    categories:Array.isArray(d.categories)&&d.categories.length?d.categories:b.categories,
    tx:Array.isArray(d.tx)?d.tx.filter(t=>t&&t.date&&isFinite(t.amount)):[],
    recurring:Array.isArray(d.recurring)?d.recurring:[],
    pending:Array.isArray(d.pending)?d.pending:[],
    settings:{...b.settings,...(d.settings||{})},
    lastCat:d.lastCat||{}};
}
let storageOK=true;
function load(){try{const raw=localStorage.getItem(KEY);return raw?normalize(JSON.parse(raw)):defaults()}catch(e){storageOK=false;return defaults()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false;toast('資料無法儲存：請確認不是無痕模式，且裝置還有空間')}}

const catsOf=t=>S.categories.filter(c=>c.type===t).sort((a,b)=>a.order-b.order);
const getCat=id=>S.categories.find(c=>c.id===id)||{id,name:'未分類',icon:'❔',color:'#8A94A3',type:'expense'};
const txBetween=(a,b)=>S.tx.filter(t=>t.date>=a&&t.date<=b);
const total=(list,type)=>round2(list.reduce((s,t)=>t.type===type?s+t.amount:s,0));
function byCat(list,type){
  const m={};
  list.forEach(t=>{if(t.type!==type)return;(m[t.cat]||(m[t.cat]={cat:getCat(t.cat),amount:0,count:0}));m[t.cat].amount+=t.amount;m[t.cat].count++});
  return Object.values(m).map(x=>({...x,amount:round2(x.amount)})).sort((a,b)=>b.amount-a.amount);
}
const sortTx=(a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0);

/* ================= 固定收支 ================= */
function matches(r,s){
  const d=parseD(s),y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  if(r.freq==='monthly')return day===Math.min(r.day,dim(y,m));
  if(r.freq==='weekly')return d.getDay()===r.weekday;
  if(r.freq==='yearly')return m===r.month&&day===Math.min(r.day,dim(y,m));
  return false;
}
function runRecurring(){
  const today=todayStr();let auto=0,pend=0,changed=false;
  for(const r of S.recurring){
    if(!r.lastRun)r.lastRun=addDays(r.start,-1);
    if(r.lastRun>=today)continue;
    if(!r.active){r.lastRun=today;changed=true;continue}
    const stop=r.end&&r.end<today?r.end:today;
    let d=addDays(r.lastRun,1),guard=0;
    while(d<=stop&&guard++<5000){
      if(d>=r.start&&matches(r,d)){
        if(r.mode==='auto'){S.tx.push({id:uid(),type:r.type,amount:r.amount,cat:r.cat,date:d,note:r.name,rid:r.id,created:Date.now()});auto++}
        else if(!S.pending.some(p=>p.rid===r.id&&p.date===d)){S.pending.push({id:uid(),rid:r.id,date:d,amount:r.amount});pend++}
      }
      d=addDays(d,1);
    }
    r.lastRun=today;changed=true;
  }
  if(changed)save();
  return {auto,pend};
}
function nextRun(r){
  if(!r.active)return null;
  let d=addDays(r.lastRun||addDays(r.start,-1),1);if(d<r.start)d=r.start;
  for(let i=0;i<400;i++){if(r.end&&d>r.end)return null;if(matches(r,d))return d;d=addDays(d,1)}
  return null;
}
const freqText=r=>r.freq==='monthly'?`每月 ${r.day} 日`:r.freq==='weekly'?`每週${WD[r.weekday]}`:`每年 ${r.month} 月 ${r.day} 日`;
const monthlyEq=r=>r.freq==='monthly'?r.amount:r.freq==='weekly'?r.amount*52/12:r.amount/12;

/* ================= 預算 ================= */
const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
function budgetCfg(){const b=S.settings.budget;return b&&b.period&&b.period!=='none'&&b.amount>0?b:null}
function periodOf(ds,b){
  if(b.period==='month')return monthRange(ds.slice(0,7));
  const d=parseD(ds),off=(d.getDay()-(S.settings.weekStart||0)+7)%7,a=addDays(ds,-off);return [a,addDays(a,6)];
}
const budgetSpend=(list,b)=>round2(list.reduce((s,t)=>t.type==='expense'&&!(b.excludeFixed&&t.rid)?s+t.amount:s,0));
function budgetInfo(ref=todayStr()){
  const b=budgetCfg();if(!b)return null;
  const [a,e]=periodOf(ref,b),days=dayDiff(a,e)+1,elapsed=dayDiff(a,ref)+1,left=days-elapsed+1;
  const before=budgetSpend(txBetween(a,addDays(ref,-1)),b),today=budgetSpend(txBetween(ref,ref),b),spent=round2(before+today);
  const allow=Math.max(0,b.amount-before)/left;
  return {b,label:b.period==='month'?'本月':'本週',amount:b.amount,start:a,end:e,days,elapsed,left,spent,spentToday:today,daily:b.amount/days,todayAllow:allow,todayLeft:allow-today,remain:round2(b.amount-spent)};
}
function dayLimit(ds){const b=budgetCfg();if(!b)return null;return b.period==='month'?b.amount/dim(+ds.slice(0,4),+ds.slice(5,7)):b.amount/7}
const shortAmt=v=>v>=100000?Math.round(v/10000)+'萬':v>=10000?(+(v/10000).toFixed(1))+'萬':fmt(Math.round(v));
function defaultDay(k){
  const T=todayStr();if(k===T.slice(0,7))return T;
  const ds=S.tx.filter(t=>t.date.startsWith(k)).map(t=>t.date).sort();
  return ds.length?ds[ds.length-1]:k+'-01';
}

/* ================= 畫面狀態 ================= */
const T0=todayStr();
const V={tab:'list',month:T0.slice(0,7),day:T0,rMode:'month',rMonth:T0.slice(0,7),rYear:+T0.slice(0,4),rType:'expense'};
const TITLES={list:'記帳',report:'報表',fixed:'固定收支',settings:'設定'};

function render(){
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===V.tab));
  $('#fab').hidden=!(V.tab==='list'||V.tab==='report');
  $('#title').textContent=TITLES[V.tab];
  const vt=$('#viewToggle');vt.hidden=V.tab!=='list';vt.textContent=S.settings.listView==='list'?'📅 日曆':'☰ 清單';
  $('#view').innerHTML=({list:viewList,report:viewReport,fixed:viewFixed,settings:viewSettings})[V.tab]();
}
function monthNav(key,k){
  const [y,m]=key.split('-');
  return `<div class="mnav"><button class="icon-btn" data-act="mShift" data-k="${k}" data-n="-1" aria-label="上個月">‹</button><label class="mlabel"><span>${y}年${+m}月</span><input type="month" value="${key}" data-chg="mPick" data-k="${k}" aria-label="選擇月份"></label><button class="icon-btn" data-act="mShift" data-k="${k}" data-n="1" aria-label="下個月">›</button></div>`;
}
function txRow(t){
  const c=getCat(t.cat);
  return `<button class="row" data-act="editTx" data-id="${t.id}"><span class="ico" style="--cbg:${tint(c.color)}">${esc(c.icon)}</span><span class="row-main"><span class="row-t">${esc(c.name)}${t.rid?'<i class="tag">固定</i>':''}</span>${t.note?`<span class="row-s">${esc(t.note)}</span>`:''}</span><span class="amt num ${t.type}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</span></button>`;
}

/* ---------- 明細 ---------- */
function viewList(){
  const [a,b]=monthRange(V.month);
  const list=txBetween(a,b).sort(sortTx);
  const inc=total(list,'income'),exp=total(list,'expense'),net=round2(inc-exp);
  const isCur=V.month===todayStr().slice(0,7);
  let h='';
  if(!storageOK)h+=`<div class="notice">⚠️ 這個瀏覽器無法儲存資料，可能是無痕模式。關閉 App 後紀錄會消失。</div>`;
  if(S.pending.length)h+=`<button class="notice" data-act="pending"><span>🔔 有 ${S.pending.length} 筆固定收支等待確認</span><span class="chev">›</span></button>`;
  const lb=S.settings.lastBackup,days=lb?Math.floor((Date.now()-lb)/864e5):null;
  if(S.tx.length>=30&&(days===null||days>=30))h+=`<button class="notice" data-act="backup"><span>💾 ${days===null?'還沒有備份過資料':`已經 ${days} 天沒有備份`}，點這裡匯出備份檔</span><span class="chev">›</span></button>`;
  h+=monthNav(V.month,'list');
  h+=`<div class="strip"><div><small>收入</small><b class="num inc">$${fmt(inc)}</b></div><div><small>支出</small><b class="num exp">$${fmt(exp)}</b></div><div><small>結餘</small><b class="num ${net<0?'exp':''}">${money(net)}</b></div></div>`;
  if(isCur)h+=budgetCard();
  if(S.settings.listView==='list'){
    if(!list.length)return h+`<div class="empty"><div class="empty-ico">🧾</div><p><b>這個月還沒有紀錄</b></p><p>按右下角的 ＋ 記下第一筆</p></div>`;
    const groups={};list.forEach(t=>(groups[t.date]||(groups[t.date]=[])).push(t));
    for(const d of Object.keys(groups)){
      const g=groups[d],dn=round2(total(g,'income')-total(g,'expense')),dt=parseD(d);
      h+=`<div class="day"><div class="day-h"><span>${dt.getMonth()+1}月${dt.getDate()}日 週${WD[dt.getDay()]}${d===todayStr()?'（今天）':''}</span><span class="num">${dn>0?'+':''}${dn<0?'−':''}${fmt(Math.abs(dn))}</span></div><div class="group">${g.map(txRow).join('')}</div></div>`;
    }
    return h;
  }
  if(!V.day||!V.day.startsWith(V.month))V.day=defaultDay(V.month);
  return h+calendar(list)+dayDetail();
}
function budgetCard(){
  const bi=budgetInfo();
  if(!bi)return `<button class="bset" data-act="budget"><span>🎯 設定每週或每月預算，看每天還能花多少</span><span class="chev-r">›</span></button>`;
  const over=bi.todayLeft<0,usedPct=bi.spent/bi.amount,pace=Math.min(bi.elapsed/bi.days,1);
  const bc=bi.spent>bi.amount?'var(--exp)':usedPct>pace?'var(--warn)':'var(--inc)';
  const range=bi.b.period==='week'?`（${+bi.start.slice(5,7)}/${+bi.start.slice(8)}–${+bi.end.slice(5,7)}/${+bi.end.slice(8)}）`:'';
  return `<button class="budget ${over?'over':''}" data-act="budget" aria-label="編輯預算">
    <div class="b-top"><span>${bi.label}預算${range} <b class="num">$${fmt(bi.amount)}</b></span><span class="muted">平均每天 $${fmt(Math.floor(bi.daily))}</span></div>
    <div class="b-main"><small>${over?'今天已超出':'今天還能花'}</small><b class="num">$${fmt(Math.abs(over?Math.ceil(-bi.todayLeft):Math.floor(bi.todayLeft)))}</b></div>
    <div class="b-bar" style="--bc:${bc}"><i style="width:${Math.min(usedPct,1)*100}%"></i><em style="left:${pace*100}%" title="時間進度"></em></div>
    <div class="b-foot"><span>已花 $${fmt(bi.spent)}（${Math.round(usedPct*100)}%）</span><span>${bi.remain>=0?`剩 $${fmt(bi.remain)}，含今天還有 ${bi.left} 天`:`已超支 $${fmt(-bi.remain)}`}</span></div>
  </button>`;
}
function calendar(list){
  const [y,m]=V.month.split('-').map(Number),n=dim(y,m),ws=S.settings.weekStart||0,T=todayStr(),bc=budgetCfg(),bi=budgetInfo();
  const lead=(new Date(y,m-1,1).getDay()-ws+7)%7;
  const by={};
  list.forEach(t=>{const o=by[t.date]||(by[t.date]={exp:0,inc:0,bexp:0});
    if(t.type==='expense'){o.exp+=t.amount;if(!(bc&&bc.excludeFixed&&t.rid))o.bexp+=t.amount}else o.inc+=t.amount});
  let cells='<span></span>'.repeat(lead);
  for(let d=1;d<=n;d++){
    const ds=`${V.month}-${pad(d)}`,o=by[ds],lim=ds===T&&bi?bi.todayAllow:dayLimit(ds),over=!!(o&&lim!==null&&o.bexp>lim+0.001);
    const cls=['cd',ds===T?'today':'',ds===V.day?'sel':'',over?'over':'',ds>T?'future':''].join(' ');
    cells+=`<button class="${cls}" data-act="pickDay" data-d="${ds}" aria-label="${m}月${d}日${o?`，支出 ${fmt(o.exp)}`:''}"><span class="cd-n num">${d}</span>${o&&o.exp?`<span class="cd-a num">${shortAmt(o.exp)}</span>`:''}${o&&o.inc?'<i class="cd-i"></i>':''}</button>`;
  }
  const heads=Array.from({length:7},(_,i)=>`<span>${WD[(i+ws)%7]}</span>`).join('');
  const lim=dayLimit(`${V.month}-01`);
  return `<section class="cal"><div class="cal-h">${heads}</div><div class="cal-g">${cells}</div><div class="cal-legend">${lim?`<span><i class="lg over"></i>超過當天額度（平均每天 $${fmt(Math.floor(lim))}）</span>`:''}<span><i class="lg inc"></i>當天有收入</span></div></section>`;
}
function dayDetail(){
  const ds=V.day,dt=parseD(ds),items=S.tx.filter(t=>t.date===ds).sort(sortTx),bc=budgetCfg();
  const e=total(items,'expense'),i=total(items,'income'),be=bc?budgetSpend(items,bc):0,isT=ds===todayStr(),bi=isT?budgetInfo():null;
  const lim=bi?bi.todayAllow:dayLimit(ds);
  let sub=`支出 $${fmt(e)}${i?`，收入 $${fmt(i)}`:''}`;
  if(lim!==null&&ds<=todayStr()){
    if(isT)sub+=`，今天額度 $${fmt(Math.floor(lim))}`;
    sub+=be>lim+0.001?`，<span class="over">超出 $${fmt(Math.ceil(be-lim))}</span>`:items.length?`，<span class="ok">在額度內</span>`:'';
  }
  let h=`<section class="day-sel" id="daySel"><div class="ds-h"><div><b>${dt.getMonth()+1}月${dt.getDate()}日 週${WD[dt.getDay()]}</b>${ds===todayStr()?' <span class="muted">今天</span>':''}<div class="ds-sub">${sub}</div></div><button class="ds-add" data-act="add">＋ 記在這天</button></div>`;

    h+=`<section class="panel"><h2>每月收支</h2><div class="bars">${bars(ms)}</div><div class="legend"><span><span class="dot inc"></span>收入</span><span><span class="dot exp"></span>支出</span><span style="margin-left:auto">點月份可看該月細節</span></div></section>`;

function donut(items,tt,label){
  const R=92,r=60,cx=105,cy=105,mid=(R+r)/2,w=R-r;
  const pt=(a,rad)=>`${(cx+rad*Math.cos(a)).toFixed(2)} ${(cy+rad*Math.sin(a)).toFixed(2)}`;
  let a=-Math.PI/2,s='';
  for(const it of items){
    const f=it.amount/tt;if(f<=0)continue;
    if(f>0.9999){s+=`<circle cx="${cx}" cy="${cy}" r="${mid}" fill="none" stroke="${it.cat.color}" stroke-width="${w}" data-act="catDetail" data-cat="${it.cat.id}"/>`;break}
    const a2=a+f*Math.PI*2,lg=f>.5?1:0;
    s+=`<path d="M${pt(a,R)}A${R} ${R} 0 ${lg} 1 ${pt(a2,R)}L${pt(a2,r)}A${r} ${r} 0 ${lg} 0 ${pt(a,r)}Z" fill="${it.cat.color}" stroke="var(--card)" stroke-width="1.5" data-act="catDetail" data-cat="${it.cat.id}"><title>${esc(it.cat.name)} ${(f*100).toFixed(1)}%</title></path>`;
    a=a2;
  }
  return `<svg viewBox="0 0 210 210" role="img" aria-label="${label}分類占比">${s}<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="12" fill="var(--muted)">${label}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)" class="num">$${fmt(tt)}</text></svg>`;
}
function niceMax(v){if(v<=0)return 1000;const e=Math.pow(10,Math.floor(Math.log10(v))),n=v/e;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e}
const shortN=v=>v>=10000?(+(v/10000).toFixed(1))+'萬':v>=1000?(+(v/1000).toFixed(1))+'千':String(v);
function bars(ms){
  const W=340,H=180,L=34,B=22,T=8,max=niceMax(Math.max(...ms.map(x=>Math.max(x.inc,x.exp)))),gw=(W-L)/12,bw=Math.min(9,gw*.32);
  const y=v=>T+(H-T-B)*(1-v/max);
  let s='';
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v).toFixed(1);s+=`<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${+yy+4}" text-anchor="end" font-size="9.5" fill="var(--muted)">${shortN(v)}</text>`}
  ms.forEach((x,i)=>{const cx=L+gw*i+gw/2,base=y(0);
    s+=`<rect x="${(cx-bw-1).toFixed(1)}" y="${y(x.inc).toFixed(1)}" width="${bw}" height="${(base-y(x.inc)).toFixed(1)}" rx="2" fill="var(--inc)"/>`;
    s+=`<rect x="${(cx+1).toFixed(1)}" y="${y(x.exp).toFixed(1)}" width="${bw}" height="${(base-y(x.exp)).toFixed(1)}" rx="2" fill="var(--exp)"/>`;
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.m}月</text>`;
    s+=`<rect x="${L+gw*i}" y="0" width="${gw}" height="${H}" fill="transparent" data-act="goMonth" data-m="${x.m}" style="cursor:pointer"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每月收入與支出長條圖">${s}</svg>`;
}

/* ================= 底部面板 ================= */
const stack=[];
function openSheet(build,opts={}){
  const wrap=document.createElement('div');wrap.className='sheet-wrap';
  wrap.innerHTML=`<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div></div>`;
  document.body.appendChild(wrap);
  const panel=document.createElement('div');panel.style.cssText='display:flex;flex-direction:column;min-height:0;flex:1';
  wrap.querySelector('.sheet').appendChild(panel);
  const api={wrap,el:panel,onClose:opts.onClose,close:()=>closeSheet(api)};
  stack.push(api);build(panel,api);
  document.body.classList.add('locked');
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add('open')));
  wrap.querySelector('.backdrop').onclick=()=>api.close();
  return api;
}
function closeSheet(api){
  const i=stack.indexOf(api);if(i<0)return;stack.splice(i,1);
  api.wrap.classList.remove('open');setTimeout(()=>api.wrap.remove(),280);
  if(!stack.length)document.body.classList.remove('locked');
  api.onClose&&api.onClose();
}
const head=(title,l='',r='')=>`<div class="sh-head"><div class="l">${l}</div><h3>${title}</h3><div class="r">${r}</div></div>`;
function confirmBox(title,msg,ok='確定',danger=false){
  return new Promise(res=>{let v=false;
    openSheet((el,api)=>{
      el.innerHTML=`${head(esc(title))}<div class="dialog-msg">${msg}</div><div class="btns" style="margin-top:12px"><button class="btn ${danger?'danger':''}" data-x="ok" style="${danger?'background:var(--exp);color:#fff':''}">${esc(ok)}</button><button class="btn ghost" data-x="no">取消</button></div>`;
      el.querySelector('[data-x=ok]').onclick=()=>{v=true;api.close()};
      el.querySelector('[data-x=no]').onclick=()=>api.close();
    },{onClose:()=>res(v)});
  });
}
let toastT;
function toast(msg,actText,actFn){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${actText?`<button>${esc(actText)}</button>`:''}`;
  if(actText)t.querySelector('button').onclick=()=>{t.classList.remove('show');actFn()};
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),actText?5000:2600);
}

function openEntry(tx){
  const edit=!!tx;

  let date=tx?tx.date:(V.tab==='list'&&S.settings.listView!=='list'&&V.day?V.day:(V.month===todayStr().slice(0,7)||V.tab!=='list'?todayStr():`${V.month}-01`));

    el.innerHTML=`${head('',`<button class="link" data-x="cancel">取消</button>`,edit?`<button class="link danger" data-x="del">刪除</button>`:'')}

      <div class="cat-grid" id="eCats"></div>
      <div class="meta"><label class="pill">📅 <span id="eDateL"></span><input type="date" id="eDate" value="${date}"></label><input class="note" id="eNote" placeholder="備註（選填）" maxlength="60" value="${esc(tx?.note||'')}" enterkeyhint="done"></div>
      <div class="keypad">${['1','2','3','⌫','4','5','6','C','7','8','9','ok','00','0','.'].map(k=>k==='ok'?`<button class="key ok" data-k="ok">${edit?'儲存':'記下'}</button>`:`<button class="key ${/[⌫C]/.test(k)?'fn':''} num" data-k="${k}">${k}</button>`).join('')}</div>`;
    const hd=el.querySelector('.sh-head h3');
    hd.innerHTML=`<div class="seg" style="width:150px"><button data-t="expense">支出</button><button data-t="income">收入</button></div>`;
    const draw=()=>{
      const c=getCat(cat);
      $('#eIco',el).textContent=c.icon;$('#eIco',el).style.setProperty('--cbg',tint(c.color));$('#eName',el).textContent=c.name;
      const a=$('#eAmt',el);a.textContent='$'+(amt?Number(amt).toLocaleString('zh-TW',{maximumFractionDigits:2})+(amt.endsWith('.')?'.':''):'0');
      a.className=`amount num ${type}${amt?'':' zero'}`;
      $$('.seg button',hd).forEach(b=>b.classList.toggle('on',b.dataset.t===type));
      hd.querySelector('.seg').className=`seg ${type==='income'?'inc-on':'exp-on'}`;
      el.querySelector('.key.ok').className=`key ok ${type==='income'?'inc':'exp'}`;
      $$('.cat',el).forEach(b=>b.classList.toggle('on',b.dataset.id===cat));
      const d=parseD(date);$('#eDateL',el).textContent=date===todayStr()?'今天':`${d.getMonth()+1}/${d.getDate()}`;
    };
    const drawCats=()=>{
      $('#eCats',el).innerHTML=catsOf(type).map(c=>`<button class="cat" data-id="${c.id}" style="--cc:${c.color}"><span class="ico" style="--cbg:${tint(c.color)}">${esc(c.icon)}</span>${esc(c.name)}</button>`).join('')+`<button class="cat add" data-add="1"><span class="ico">＋</span>新增</button>`;
      draw();
    };
    drawCats();
    hd.onclick=e=>{const b=e.target.closest('[data-t]');if(!b||b.dataset.t===type)return;type=b.dataset.t;pickDefaultCat();drawCats()};
    $('#eCats',el).onclick=e=>{
      const b=e.target.closest('.cat');if(!b)return;
      if(b.dataset.add){openCatEditor(type,null,c=>{cat=c.id;drawCats()});return}
      cat=b.dataset.id;draw();
    };
    $('#eDate',el).onchange=e=>{if(e.target.value){date=e.target.value;draw()}};
    $('#eNote',el).onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
    const press=k=>{
      if(k==='ok')return doSave();
      if(k==='⌫')amt=amt.slice(0,-1);
      else if(k==='C')amt='';
      else if(k==='.'){if(!amt.includes('.'))amt=(amt||'0')+'.'}
      else{
        const [ip,dp]=amt.split('.');
        if(dp!==undefined){if(dp.length+k.length<=2)amt+=k}
        else if(k==='00'){if(amt&&amt!=='0'&&ip.length<=7)amt+=k}
        else if(amt==='0')amt=k;
        else if(ip.length<9)amt+=k;
      }
      draw();
    };

      if(document.activeElement&&document.activeElement.id==='eNote')return;

      const v=round2(parseFloat(amt));
      if(!v||v<=0){toast('請輸入金額');return}
      if(!cat){toast('請選擇分類');return}
      const note=$('#eNote',el).value.trim();
      if(edit){Object.assign(tx,{type,amount:v,cat,date,note})}

      S.lastCat[type]=cat;save();

      let msg=edit?'已儲存變更':`已記下 ${type==='income'?'收入':'支出'} $${fmt(v)}`;

      if(bi&&!edit)msg+=bi.todayLeft<0?`，今天已超出額度 $${fmt(Math.ceil(-bi.todayLeft))}`:`，今天還能花 $${fmt(Math.floor(bi.todayLeft))}`;
      toast(msg);
    };
    el.querySelector('[data-x=cancel]').onclick=()=>api.close();
    if(edit)el.querySelector('[data-x=del]').onclick=()=>{
      const i=S.tx.indexOf(tx);if(i<0)return;S.tx.splice(i,1);save();api.close();render();
      toast('已刪除這筆紀錄','復原',()=>{S.tx.push(tx);save();render()});
    };
  });
}

        const cs=catsOf(type),i=cs.findIndex(c=>c.id===(b.dataset.up||b.dataset.down)),j=b.dataset.up?i-1:i+1;
        if(j<0||j>=cs.length)return;[cs[i],cs[j]]=[cs[j],cs[i]];cs.forEach((c,k)=>c.order=k);save();draw();
      }
    };
  },{onClose:render});
}
function openCatEditor(type,cat,onDone){
  const used=new Set(catsOf(type).map(c=>c.color));
  let name=cat?.name||'',icon=cat?.icon||'📦',color=cat?.color||COLORS.find(c=>!used.has(c))||COLORS[0];
  openSheet((el,api)=>{
    el.innerHTML=`${head(cat?'編輯分類':`新增${type==='income'?'收入':'支出'}分類`,`<button class="link" data-x="cancel">取消</button>`,`<button class="link strong" data-x="save">儲存</button>`)}<div class="sh-body">
      <div class="preview"><span class="ico" id="pIco"></span><b id="pName"></b></div>

    const draw=()=>{
      $('#pIco',el).textContent=icon;$('#pIco',el).style.setProperty('--cbg',tint(color));$('#pName',el).textContent=name||'分類名稱';
      $$('[data-e]',el).forEach(b=>b.classList.toggle('on',b.dataset.e===icon));
      $$('[data-c]',el).forEach(b=>b.classList.toggle('on',b.dataset.c===color));
    };draw();
    $('#cName',el).oninput=e=>{name=e.target.value;draw()};
    $('#cEmoji',el).oninput=e=>{const v=e.target.value.trim();if(!v)return;
      icon=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter().segment(v)][0].segment:Array.from(v)[0];draw()};
    el.onclick=async e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.e){icon=b.dataset.e;draw()}
      else if(b.dataset.c){color=b.dataset.c;draw()}
      else if(b.dataset.x==='cancel')api.close();
      else if(b.dataset.x==='save'){
        name=name.trim();if(!name){toast('請輸入分類名稱');return}
        if(catsOf(type).some(c=>c.name===name&&c.id!==cat?.id)){toast('已經有同名的分類');return}
        let res;
        if(cat){Object.assign(cat,{name,icon,color});res=cat}
        else{res={id:uid(),type,name,icon,color,order:catsOf(type).length};S.categories.push(res)}
        save();api.close();onDone&&onDone(res);
      }
      else if(b.dataset.x==='del')deleteCat(cat,()=>{api.close();onDone&&onDone(null)});
    };
  });
}
function deleteCat(cat,done){
  const others=catsOf(cat.type).filter(c=>c.id!==cat.id);
  if(!others.length){toast('每一種類型至少要保留一個分類');return}
  const nTx=S.tx.filter(t=>t.cat===cat.id).length,nRec=S.recurring.filter(r=>r.cat===cat.id).length;
  const doDel=to=>{
    if(to){S.tx.forEach(t=>{if(t.cat===cat.id)t.cat=to});S.recurring.forEach(r=>{if(r.cat===cat.id)r.cat=to})}
    S.categories=S.categories.filter(c=>c.id!==cat.id);
    for(const k in S.lastCat)if(S.lastCat[k]===cat.id)delete S.lastCat[k];
    catsOf(cat.type).forEach((c,i)=>c.order=i);save();done();toast(`已刪除「${cat.name}」`);
  };
  if(!nTx&&!nRec){confirmBox(`刪除「${cat.name}」？`,'這個分類沒有任何紀錄。','刪除',true).then(ok=>ok&&doDel(null));return}
  openSheet((el,api)=>{
    el.innerHTML=`${head(`刪除「${esc(cat.name)}」`,`<button class="link" data-x="cancel">取消</button>`)}<div class="sh-body">
      <div class="callout warn">這個分類有 ${nTx} 筆紀錄${nRec?`、${nRec} 個固定收支`:''}。刪除前，請選擇要把它們移到哪個分類。</div>
      <div class="group">${others.map(c=>`<button class="row" data-to="${c.id}"><span class="ico" style="--cbg:${tint(c.color)}">${esc(c.icon)}</span><span class="row-main"><span class="row-t">移到「${esc(c.name)}」</span></span></button>`).join('')}</div></div>`;
    el.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.x==='cancel')api.close();
      else if(b.dataset.to){api.close();doDel(b.dataset.to)}};
  });
}

      <div class="field"><label for="rAmt">金額</label><input class="input num" id="rAmt" inputmode="decimal" value="${esc(d.amount)}" placeholder="0"></div>

      <div class="field"><span class="flabel">週期</span><div class="seg"><button data-f="monthly" class="${d.freq==='monthly'?'on':''}">每月</button><button data-f="weekly" class="${d.freq==='weekly'?'on':''}">每週</button><button data-f="yearly" class="${d.freq==='yearly'?'on':''}">每年</button></div>
        <div style="margin-top:8px">${
          d.freq==='monthly'?`<div class="inline"><span>每月</span><select class="input" id="rDay">${opts(31,d.day,' 日')}</select></div><p class="hint">選 29–31 日時，遇到較短的月份會在月底記帳。</p>`:
          d.freq==='weekly'?`<div class="chips">${[...WD].map((w,i)=>`<button class="chip ${i===d.weekday?'on':''}" data-wd="${i}">週${w}</button>`).join('')}</div>`:
          `<div class="inline"><span>每年</span><select class="input" id="rMon">${opts(12,d.month,' 月')}</select><select class="input" id="rDay">${opts(31,d.day,' 日')}</select></div>`
        }</div></div>
      <div class="field"><span class="flabel">入帳方式</span><div class="seg"><button data-m="auto" class="${d.mode==='auto'?'on':''}">自動入帳</button><button data-m="confirm" class="${d.mode==='confirm'?'on':''}">待我確認</button></div>
        <p class="hint">${d.mode==='auto'?'到了日期就自動記下這筆，適合金額固定的項目，例如房租、訂閱費。':'到了日期先列入「待確認」，你可以修改金額再記下，適合每期金額不同的項目，例如電費、信用卡費。'}</p></div>
      <div class="field"><label for="rStart">開始日期</label><input class="input" type="date" id="rStart" value="${d.start}"></div>

      ${edit?`<div class="field"><span class="flabel">狀態</span><div class="seg"><button data-a="1" class="${d.active?'on':''}">啟用中</button><button data-a="0" class="${!d.active?'on':''}">暫停</button></div><p class="hint">暫停期間不會記帳，恢復後也不會補記暫停期間的項目。</p></div>
        <button class="btn danger" data-x="del">刪除這個固定收支</button>`:''}
      </div>`;
    };
    draw();
    el.onclick=async e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.x==='cancel')return api.close();
      if(b.dataset.x==='del'){
        if(await confirmBox(`刪除「${r.name}」？`,'之後不會再自動記帳，已經記下的紀錄會保留。','刪除',true)){
          S.recurring=S.recurring.filter(x=>x.id!==r.id);S.pending=S.pending.filter(p=>p.rid!==r.id);save();api.close();render();toast('已刪除固定收支');

      }
      if(b.dataset.x==='save'){
        read();
        const amount=round2(parseFloat(String(d.amount).replace(/,/g,'')));
        if(!d.name.trim()){toast('請輸入名稱');return}
        if(!amount||amount<=0){toast('請輸入金額');return}
        if(!d.cat){toast('請選擇分類');return}
        if(d.end&&d.end<d.start){toast('結束日期不能早於開始日期');return}
        const T2=todayStr();
        const base={type:d.type,name:d.name.trim(),amount,cat:d.cat,freq:d.freq,day:d.day,weekday:d.weekday,month:d.month,start:d.start,end:d.end||'',mode:d.mode,active:d.active};
        if(edit){
          const wasActive=r.active;Object.assign(r,base);
          if(r.start>T2)r.lastRun=addDays(r.start,-1);
          if(!wasActive&&r.active)r.lastRun=T2;
        }else S.recurring.push({id:uid(),...base,lastRun:addDays(d.start,-1),created:Date.now()});
        const res=runRecurring();save();api.close();render();
        toast(res.auto?`已儲存，補記了 ${res.auto} 筆`:res.pend?`已儲存，有 ${res.pend} 筆待確認`:'已儲存固定收支');
        return;
      }
      read();
      if(b.dataset.t&&b.dataset.t!==d.type){d.type=b.dataset.t;d.cat=catsOf(d.type)[0]?.id}
      else if(b.dataset.cat)d.cat=b.dataset.cat;
      else if(b.dataset.f)d.freq=b.dataset.f;
      else if(b.dataset.wd)d.weekday=+b.dataset.wd;
      else if(b.dataset.m)d.mode=b.dataset.m;
      else if(b.dataset.a)d.active=b.dataset.a==='1';
      else return;
      const sc=el.querySelector('.sh-body').scrollTop;draw();el.querySelector('.sh-body').scrollTop=sc;
    };
  });
}

/* ---------- 預算設定 ---------- */
function openBudget(){
  const cur=S.settings.budget||{};
  const b={period:cur.period||'none',amount:cur.amount||'',excludeFixed:cur.excludeFixed!==false};let ws=S.settings.weekStart||0;
  openSheet((el,api)=>{
    const T=todayStr();
    const days=()=>b.period==='month'?dim(+T.slice(0,4),+T.slice(5,7)):7;
    const amt=()=>round2(parseFloat(String(b.amount).replace(/,/g,'')))||0;
    const prev=()=>amt()?`每日額度約 <b class="num">$${fmt(Math.floor(amt()/days()))}</b>（$${fmt(amt())} ÷ ${days()} 天）。<br>之後每天會依「剩下的預算 ÷ 剩下的天數」重新計算今天還能花多少：前幾天省下來，後面就能多花；前面花超過，後面每天的額度就會變少。`:'輸入金額後，這裡會顯示每天可以花多少。';
    const draw=()=>{
      el.innerHTML=`${head('支出預算',`<button class="link" data-x="cancel">取消</button>`,`<button class="link strong" data-x="save">儲存</button>`)}<div class="sh-body">
        <div class="field"><span class="flabel">預算週期</span><div class="seg"><button data-p="none" class="${b.period==='none'?'on':''}">不設定</button><button data-p="week" class="${b.period==='week'?'on':''}">每週</button><button data-p="month" class="${b.period==='month'?'on':''}">每月</button></div></div>
        ${b.period==='none'?'<p class="hint">設定預算後，明細頁會顯示「今天還能花多少」，日曆也會標出超過每日額度的日子。</p>':`
        <div class="field"><label for="bAmt">${b.period==='week'?'每週':'每月'}可以花的金額</label><input class="input num" id="bAmt" inputmode="decimal" value="${esc(b.amount)}" placeholder="${b.period==='week'?'例如 3000':'例如 12000'}"></div>
        <div class="callout" id="bPrev">${prev()}</div>
        <div class="field"><span class="flabel">固定支出（房租、保險、訂閱費等）</span><div class="seg"><button data-fx="1" class="${b.excludeFixed?'on':''}">不算進預算</button><button data-fx="0" class="${!b.excludeFixed?'on':''}">算進預算</button></div>
          <p class="hint">建議選「不算進預算」，預算只管日常花費，每日額度才不會被房租這類大筆固定支出吃掉。</p></div>`}
        <div class="field"><span class="flabel">每週從哪一天開始</span><div class="seg"><button data-ws="0" class="${ws===0?'on':''}">星期日</button><button data-ws="1" class="${ws===1?'on':''}">星期一</button></div><p class="hint">每週預算和日曆的排列都會用這個設定。</p></div>
      </div>`;
      const a=$('#bAmt',el);if(a)a.oninput=e=>{b.amount=e.target.value;$('#bPrev',el).innerHTML=prev()};
    };
    draw();
    el.onclick=e=>{
      const t=e.target.closest('button');if(!t)return;
      if(t.dataset.x==='cancel')return api.close();
      if(t.dataset.x==='save'){
        if(b.period!=='none'&&!(amt()>0)){toast('請輸入預算金額');return}
        S.settings.budget={period:b.period,amount:b.period==='none'?0:amt(),excludeFixed:b.excludeFixed};S.settings.weekStart=ws;
        save();api.close();render();toast(b.period==='none'?'已關閉預算':'已儲存預算');return;
      }
      if(t.dataset.p){b.period=t.dataset.p}
      else if(t.dataset.fx){b.excludeFixed=t.dataset.fx==='1'}
      else if(t.dataset.ws){ws=+t.dataset.ws}
      else return;
      const sc=el.querySelector('.sh-body').scrollTop;draw();el.querySelector('.sh-body').scrollTop=sc;
    };
  });
}

/* ---------- 報表內容 ---------- */
const stamp=()=>{const n=new Date();return `${n.getFullYear()}/${pad(n.getMonth()+1)}/${pad(n.getDate())} ${pad(n.getHours())}:${pad(n.getMinutes())}`};
function detailSheet(list,title){
  const sh=new XL.Sheet('明細');sh.widths=[12,8,14,13,13,30,8];
  sh.set(0,0,title,'title');sh.merges.push('A1:G1');sh.heights[0]=26;
  sh.set(1,0,`共 ${list.length} 筆，匯出於 ${stamp()}`,'note');sh.merges.push('A2:G2');
  ['日期','類型','分類','收入','支出','備註','來源'].forEach((t,i)=>sh.set(3,i,t,'head'));
  const rows=[...list].sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));
  let r=4;
  if(!rows.length){sh.set(r,0,'（這段期間沒有紀錄）','txt');sh.merges.push(`A5:G5`);r++}
  rows.forEach(t=>{const c=getCat(t.cat);
    sh.set(r,0,XL.serial(t.date),'date');sh.set(r,1,t.type==='income'?'收入':'支出','txtC');sh.set(r,2,c.name,'txt');
    sh.set(r,3,t.type==='income'?t.amount:null,'num');sh.set(r,4,t.type==='expense'?t.amount:null,'num');
    sh.set(r,5,t.note||'','txt');sh.set(r,6,t.rid?'固定':'','txtC');r++});
  const last=r;
  if(rows.length)sh.filter=`A4:G${last}`;
  const ti=total(list,'income'),te=total(list,'expense');
  sh.fill(r,0,6,'totL');sh.set(r,0,'合計','totL');sh.set(r,3,ti,'totN',`SUM(D5:D${last})`);sh.set(r,4,te,'totN',`SUM(E5:E${last})`);r++;
  sh.fill(r,0,6,'netL');sh.set(r,0,'結餘（收入 − 支出）','netL');sh.set(r,4,round2(ti-te),'netN',`D${r}-E${r}`);
  sh.freeze={y:4};
  return sh;
}
function monthBook(key){
  const [y,m]=key.split('-').map(Number),[a,b]=monthRange(key),list=txBetween(a,b),days=dim(y,m);
  const sh=new XL.Sheet('收支表');sh.widths=[32,15,10,8];
  sh.set(0,0,`${y}年${m}月 收支表`,'title');sh.merges.push('A1:D1');sh.heights[0]=26;
  sh.set(1,0,`期間 ${slash(a)} 至 ${slash(b)}，匯出於 ${stamp()}`,'note');sh.merges.push('A2:D2');
  ['項目','金額','占比','筆數'].forEach((t,i)=>sh.set(3,i,t,'head'));
  let r=4;
  const section=(type,label)=>{
    sh.fill(r,0,3,type==='income'?'secInc':'secExp');sh.set(r,0,label,type==='income'?'secInc':'secExp');r++;
    const cats=byCat(list,type),start=r,n=Math.max(cats.length,1),tot=start+n,ttl=total(list,type);
    if(!cats.length){sh.set(r,0,'（無紀錄）','txt');sh.set(r,1,0,'num');sh.set(r,2,0,'pct',`IF(B$${tot+1}=0,0,B${r+1}/B$${tot+1})`);sh.set(r,3,0,'txtC');r++}
    cats.forEach(x=>{sh.set(r,0,x.cat.name,'txt');sh.set(r,1,x.amount,'num');sh.set(r,2,ttl?x.amount/ttl:0,'pct',`IF(B$${tot+1}=0,0,B${r+1}/B$${tot+1})`);sh.set(r,3,x.count,'txtC');r++});
    sh.set(r,0,`${label}合計`,'totL');sh.set(r,1,ttl,'totN',`SUM(B${start+1}:B${r})`);sh.set(r,2,ttl?1:0,'totP',`SUM(C${start+1}:C${r})`);
    sh.set(r,3,cats.reduce((s,x)=>s+x.count,0),'totN',`SUM(D${start+1}:D${r})`);
    const row=r;r+=2;return row;
  };
  const ir=section('income','收入'),er=section('expense','支出');
  const inc=total(list,'income'),exp=total(list,'expense'),net=round2(inc-exp);
  const fixedExp=round2(list.filter(t=>t.type==='expense'&&t.rid).reduce((s,t)=>s+t.amount,0));
  sh.fill(r,0,3,'sec');sh.set(r,0,'摘要','sec');r++;
  const nr=r;sh.fill(r,0,3,'netL');sh.set(r,0,'本月結餘（收入 − 支出）','netL');sh.set(r,1,net,'netN',`B${ir+1}-B${er+1}`);r++;
  sh.fill(r,0,3,'netL');sh.set(r,0,'儲蓄率（結餘 ÷ 收入）','netL');sh.set(r,1,inc?net/inc:0,'netP',`IF(B${ir+1}=0,0,B${nr+1}/B${ir+1})`);r++;
  sh.set(r,0,'其中固定支出','txt');sh.set(r,1,fixedExp,'num');sh.set(r,2,exp?fixedExp/exp:0,'pct',`IF(B${er+1}=0,0,B${r+1}/B${er+1})`);sh.set(r,3,null,'txt');r++;
  sh.set(r,0,'其中變動支出','txt');sh.set(r,1,round2(exp-fixedExp),'num',`B${er+1}-B${r}`);sh.set(r,2,exp?(exp-fixedExp)/exp:0,'pct',`IF(B${er+1}=0,0,B${r+1}/B${er+1})`);sh.set(r,3,null,'txt');r++;
  sh.set(r,0,`日均支出（÷ ${days} 天）`,'txt');sh.set(r,1,round2(exp/days),'num',`B${er+1}/${days}`);sh.set(r,2,null,'txt');sh.set(r,3,null,'txt');r++;
  const bcf=budgetCfg();
  if(bcf){
    r++;sh.fill(r,0,3,'sec');sh.set(r,0,'預算','sec');r++;
    const mb=bcf.period==='month'?bcf.amount:round2(bcf.amount/7*days),used=budgetSpend(list,bcf),b0=r;
    sh.set(r,0,bcf.period==='month'?'本月預算':`本月預算（每週 $${fmt(bcf.amount)} × ${days}/7）`,'txt');sh.set(r,1,mb,'num');sh.set(r,2,null,'txt');sh.set(r,3,null,'txt');r++;
    sh.set(r,0,bcf.excludeFixed?'計入預算的支出（不含固定支出）':'計入預算的支出','txt');sh.set(r,1,used,'num');sh.set(r,2,mb?used/mb:0,'pct',`IF(B${b0+1}=0,0,B${r+1}/B${b0+1})`);sh.set(r,3,null,'txt');r++;
    sh.fill(r,0,3,'netL');sh.set(r,0,'預算剩餘（負數表示超支）','netL');sh.set(r,1,round2(mb-used),'netN',`B${b0+1}-B${b0+2}`);r++;
    sh.set(r,0,'每日額度','txt');sh.set(r,1,round2(mb/days),'num',`B${b0+1}/${days}`);sh.set(r,2,null,'txt');sh.set(r,3,null,'txt');r++;
    const lim=mb/days,overDays=Object.values(list.filter(t=>t.type==='expense'&&!(bcf.excludeFixed&&t.rid)).reduce((m,t)=>{m[t.date]=(m[t.date]||0)+t.amount;return m},{})).filter(v=>v>lim+0.001).length;
    sh.set(r,0,'超過每日額度的天數','txt');sh.set(r,1,overDays,'num');sh.set(r,2,null,'txt');sh.set(r,3,null,'txt');
  }
  sh.freeze={y:4};
  return {name:`記帳月報_${key}.xlsx`,sheets:[sh,detailSheet(list,`${y}年${m}月 收支明細`)]};
}
function yearBook(y){
  const a=`${y}-01-01`,b=`${y}-12-31`,list=txBetween(a,b),T=todayStr();

  ov.set(1,0,`匯出於 ${stamp()}`,'note');ov.merges.push('A2:E2');
  ['月份','收入','支出','結餘','儲蓄率'].forEach((t,i)=>ov.set(3,i,t,'head'));
  ms.forEach((l,i)=>{const r=4+i,inc=total(l,'income'),exp=total(l,'expense');
    ov.set(r,0,`${i+1}月`,'txtC');ov.set(r,1,inc,'numD');ov.set(r,2,exp,'numD');ov.set(r,3,round2(inc-exp),'numD',`B${r+1}-C${r+1}`);ov.set(r,4,inc?(inc-exp)/inc:0,'pct',`IF(B${r+1}=0,0,D${r+1}/B${r+1})`)});
  const yi=total(list,'income'),ye=total(list,'expense');
  ov.set(16,0,'全年合計','netL');ov.set(16,1,yi,'netN','SUM(B5:B16)');ov.set(16,2,ye,'netN','SUM(C5:C16)');ov.set(16,3,round2(yi-ye),'netN','B17-C17');ov.set(16,4,yi?(yi-ye)/yi:0,'netP','IF(B17=0,0,D17/B17)');
  ov.set(17,0,`月平均（${nMonths} 個月）`,'totL');[1,2,3].forEach(c=>{const v=[yi,ye,yi-ye][c-1];ov.set(17,c,round2(v/nMonths),'totN',`${XL.col(c)}17/${nMonths}`)});ov.set(17,4,null,'totL');
  ov.freeze={y:4};
  // 分類收支表
  const cs=new XL.Sheet('分類收支表');cs.widths=[16,...Array(12).fill(10.5),13,12];
  const last=XL.col(14);
  cs.set(0,0,`${y}年 分類收支表`,'title');cs.merges.push(`A1:${last}1`);cs.heights[0]=26;
  cs.set(1,0,`月平均以 ${nMonths} 個月計算`,'note');cs.merges.push(`A2:${last}2`);
  ['分類',...Array.from({length:12},(_,i)=>`${i+1}月`),'合計','月平均'].forEach((t,i)=>cs.set(3,i,t,'head'));
  let r=4;const totRows={};
  for(const [type,label] of [['income','收入'],['expense','支出']]){
    const sty=type==='income'?'secInc':'secExp';cs.fill(r,0,14,sty);cs.set(r,0,label,sty);r++;
    const cats=byCat(list,type),start=r;
    const rowsData=cats.length?cats.map(x=>({name:x.cat.name,vals:ms.map(l=>round2(l.filter(t=>t.type===type&&t.cat===x.cat.id).reduce((s,t)=>s+t.amount,0)))})):[{name:'（無紀錄）',vals:Array(12).fill(0)}];
    rowsData.forEach(d=>{cs.set(r,0,d.name,'txt');d.vals.forEach((v,i)=>cs.set(r,i+1,v,'numD'));const s=d.vals.reduce((a,b)=>a+b,0);
      cs.set(r,13,round2(s),'num',`SUM(B${r+1}:M${r+1})`);cs.set(r,14,round2(s/nMonths),'num',`N${r+1}/${nMonths}`);r++});
    cs.set(r,0,`${label}合計`,'totL');
    for(let c=1;c<=14;c++){const L=XL.col(c);let v=0;for(let k=start;k<r;k++)v+=cs.rows[k][c].v;cs.set(r,c,round2(v),'totN',`SUM(${L}${start+1}:${L}${r})`)}
    totRows[type]=r;r+=2;
  }
  cs.set(r,0,'結餘','netL');
  for(let c=1;c<=14;c++){const L=XL.col(c),v=cs.rows[totRows.income][c].v-cs.rows[totRows.expense][c].v;cs.set(r,c,round2(v),'netN',`${L}${totRows.income+1}-${L}${totRows.expense+1}`)}
  cs.freeze={x:1,y:4};cs.landscape=true;
  // 固定收支
  const fx=new XL.Sheet('固定收支');fx.widths=[18,8,12,12,18,10,12,12,8];
  fx.set(0,0,'固定收支清單','title');fx.merges.push('A1:I1');fx.heights[0]=26;
  fx.set(1,0,`匯出時的設定，匯出於 ${stamp()}`,'note');fx.merges.push('A2:I2');
  ['名稱','類型','分類','金額','週期','入帳方式','開始','結束','狀態'].forEach((t,i)=>fx.set(3,i,t,'head'));
  r=4;
  if(!S.recurring.length){fx.set(r,0,'（沒有設定固定收支）','txt');fx.merges.push('A5:I5')}
  S.recurring.forEach(x=>{fx.set(r,0,x.name);fx.set(r,1,x.type==='income'?'收入':'支出','txtC');fx.set(r,2,getCat(x.cat).name);fx.set(r,3,x.amount,'num');fx.set(r,4,freqText(x));
    fx.set(r,5,x.mode==='auto'?'自動':'待確認','txtC');fx.set(r,6,XL.serial(x.start),'date');fx.set(r,7,x.end?XL.serial(x.end):'','date');fx.set(r,8,x.active?'啟用':'暫停','txtC');r++});
  fx.freeze={y:4};
  return {name:`記帳年報_${y}.xlsx`,sheets:[ov,cs,detailSheet(list,`${y}年 收支明細`),fx]};
}
async function shareOrDownload(blob,filename){
  const coarse=matchMedia('(pointer:coarse)').matches;
  if(coarse&&navigator.canShare){
    try{const file=new File([blob],filename,{type:blob.type});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file]});return true}}
    catch(e){if(e&&e.name==='AbortError')return false}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);return true;
}
async function exportMonth(k){const w=monthBook(k);await shareOrDownload(XL.book(w.sheets),w.name)}
async function exportYear(y){const w=yearBook(y);await shareOrDownload(XL.book(w.sheets),w.name)}

/* ---------- 備份 ---------- */
async function exportBackup(){
  const data=JSON.stringify({app:'ledger',version:1,exportedAt:new Date().toISOString(),data:S});
  const ok=await shareOrDownload(new Blob([data],{type:'application/json'}),`記帳備份_${todayStr()}.json`);
  if(ok){S.settings.lastBackup=Date.now();save();render();toast('已匯出備份檔')}
}
$('#importFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let d;try{d=JSON.parse(await f.text());d=d&&d.data?d.data:d;if(!d||!Array.isArray(d.tx)||!Array.isArray(d.categories))throw 0}
  catch(err){toast('這個檔案不是記帳本的備份檔');return}
  if(!await confirmBox('從備份檔還原？',`備份檔有 ${d.tx.length} 筆紀錄。還原後會取代這台裝置上目前的 ${S.tx.length} 筆紀錄。`,'還原'))return;
  S=normalize(d);save();runRecurring();applyTheme();render();toast(`已還原 ${S.tx.length} 筆紀錄`);
};

/* ---------- 安裝說明 ---------- */
function openInstall(){
  const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  openSheet((el,api)=>{
    el.innerHTML=`${head('安裝到 iPhone 主畫面','',`<button class="link strong" data-x="done">完成</button>`)}<div class="sh-body">
      ${standalone?'<div class="callout ok">你現在就是從主畫面開啟的，已經安裝好了。</div>':''}
      <ol class="steps">
        <li>用 <b>Safari</b> 打開記帳本的網址（第一次需要網路）。</li>
        <li>點畫面下方的「分享」按鈕（方框加上箭頭）。</li>
        <li>往下滑，選「<b>加入主畫面</b>」，再按右上角的「加入」。</li>
        <li>之後都從主畫面的「記帳本」圖示開啟，斷網也能使用。</li>
      </ol>
      <div class="callout warn"><b>請只在主畫面的 App 裡記帳。</b><br>iPhone 會把主畫面 App 和 Safari 分頁的資料分開存放，兩邊看不到彼此的紀錄。</div>
      <div class="callout">建議每個月匯出一次備份檔，存到「檔案」或 iCloud。換手機或想在電腦上看時，用「從備份檔還原」就能搬過去。</div></div>`;
    el.querySelector('[data-x=done]').onclick=()=>api.close();
  });
}

/* ================= 事件 ================= */
function applyTheme(){const t=S.settings.theme;if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}
const ACT={
  tab:el=>{V.tab=el.dataset.tab;render();scrollTo(0,0)},
  add:()=>openEntry(null),
  editTx:el=>{const t=S.tx.find(x=>x.id===el.dataset.id);if(t)openEntry(t)},
  mShift:el=>{const n=+el.dataset.n;if(el.dataset.k==='list'){V.month=shiftMonth(V.month,n);V.day=defaultDay(V.month)}else V.rMonth=shiftMonth(V.rMonth,n);render()},
  pickDay:el=>{V.day=el.dataset.d;render();const d=$('#daySel');if(d){const r=d.getBoundingClientRect();if(r.top>innerHeight-160)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}},
  toggleView:()=>{S.settings.listView=S.settings.listView==='list'?'calendar':'list';save();render()},
  budget:()=>openBudget(),
  yShift:el=>{V.rYear+=+el.dataset.n;render()},
  rMode:el=>{V.rMode=el.dataset.v;if(V.rMode==='year')V.rYear=+V.rMonth.slice(0,4);render()},
  rType:el=>{V.rType=el.dataset.v;render()},
  goMonth:el=>{V.rMode='month';V.rMonth=`${V.rYear}-${pad(el.dataset.m)}`;render();scrollTo(0,0)},
  catDetail:el=>openCatDetail(el.dataset.cat),
  exportCurrent:()=>V.rMode==='month'?exportMonth(V.rMonth):exportYear(V.rYear),
  pending:()=>openPending(),
  addRec:()=>openRecEditor(null),
  editRec:el=>{const r=S.recurring.find(x=>x.id===el.dataset.id);if(r)openRecEditor(r)},
  cats:()=>openCatManager(),
  exportSheet:()=>openExportSheet(),
  backup:()=>exportBackup(),
  restore:()=>$('#importFile').click(),
  theme:el=>{S.settings.theme=el.dataset.v;save();applyTheme();render()},
  install:()=>openInstall(),
  wipe:async()=>{
    if(!await confirmBox('清除所有資料？',`這會刪除全部 ${S.tx.length} 筆紀錄、分類與固定收支，而且無法復原。建議先匯出備份檔。`,'下一步',true))return;
    if(!await confirmBox('再確認一次','確定要清除這台裝置上的所有記帳資料？','清除全部資料',true))return;
    const th=S.settings.theme;S=defaults();S.settings.theme=th;save();render();toast('已清除所有資料');
  }
};
const CHG={
  mPick:el=>{if(!el.value)return;if(el.dataset.k==='list'){V.month=el.value;V.day=defaultDay(V.month)}else V.rMonth=el.value;render()}
};
document.addEventListener('click',e=>{
  if(e.target.closest('.sheet-wrap'))return;
  const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el,e)});
document.addEventListener('keydown',e=>{
  const top=stack[stack.length-1];if(!top)return;
  if(e.key==='Escape'){top.close();return}
  if(top.keyHandler&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))top.keyHandler(e);
});
let lastDay=todayStr();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  fixGap();const t=todayStr();if(t===lastDay)return;lastDay=t;if(V.day===lastDay||!V.day)V.day=t;
  const res=runRecurring();render();if(res.auto)toast(`已自動記下 ${res.auto} 筆固定收支`);
});

/* iPhone 主畫面模式：部分 iOS 版本的可視高度比螢幕短，導致底部 Tab 浮起來。量出差距並補回去。 */
function fixGap(){
  let gap=0;
  const sa=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(sa&&/iPhone|iPod/.test(navigator.userAgent)){
    const portrait=innerHeight>=innerWidth,full=portrait?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
    gap=full-innerHeight;if(gap<0||gap>80)gap=0;
  }
  document.documentElement.style.setProperty('--gap',gap+'px');
}
addEventListener('resize',fixGap);addEventListener('orientationchange',()=>setTimeout(fixGap,300));
fixGap();

/* ================= 啟動 ================= */
applyTheme();
try{if(localStorage.getItem(KEY)===null)save()}catch(e){storageOK=false}
(()=>{const res=runRecurring();render();if(res.auto)setTimeout(()=>toast(`已自動記下 ${res.auto} 筆固定收支`),400)})();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
